server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/family-app-access.log;
    error_log  /var/log/nginx/family-app-error.log;

    # Serve collected static files directly — bypasses gunicorn entirely
    location /static/ {
        alias /srv/family-app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy everything else to gunicorn on localhost
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
