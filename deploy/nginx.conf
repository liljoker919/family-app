# Initial (pre-TLS) state. After this is deployed and DNS points at the box,
# run the Certbot setup in docs/deploy/tls-certbot.md — its --nginx plugin
# rewrites this file in place to add the 443/ssl server block and the
# 80->443 redirect (#344: that step happened manually in the past and was
# never reflected back here, so a from-scratch rebuild from just this file
# would silently stay HTTP-only).
#
# www.heyfamlyapp.com (#369) is included here so a from-scratch box answers
# on both names immediately, but canonicalizing www -> bare domain (rather
# than serving both identically) needs two small hand-added 443 blocks that
# Certbot's --expand won't generate on its own — see the #369 setup notes.

# Defense-in-depth request-flood limit — django-ratelimit already covers
# login/signup/invite at the app layer, this catches generic flooding before
# it reaches gunicorn workers (#352). Tune rate/burst against real traffic.
limit_req_zone $binary_remote_addr zone=family_app:10m rate=10r/s;

server {
    listen 80;
    server_name heyfamlyapp.com www.heyfamlyapp.com;

    access_log /var/log/nginx/family-app-access.log;
    error_log  /var/log/nginx/family-app-error.log;

    client_max_body_size 10m;

    # Serve collected static files directly — bypasses gunicorn entirely
    location /static/ {
        alias /srv/family-app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy everything else to gunicorn on localhost
    location / {
        limit_req         zone=family_app burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
