# Pre-TLS state, same pattern as deploy/nginx.conf — after DNS for
# analytics.heyfamlyapp.com points at this box, run Certbot (see
# docs/deploy/umami-analytics.md) to add the 443/redirect blocks.
server {
    listen 80;
    server_name analytics.heyfamlyapp.com;

    # Proxies to the self-hosted Umami container (127.0.0.1:3000,
    # deploy/docker-compose.yml) — bound to localhost only, never exposed
    # directly.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
