name: Security Regression Suite

# This workflow runs the security regression suite on every push to main and
# on every pull request.  It is a required check that must pass before any
# changes can be merged.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  security-unit-tests:
    name: Security Unit & Schema Tests (Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security regression suite (Vitest)
        id: run-security-tests
        run: |
          npm test -- \
            --reporter=verbose \
            --reporter=junit \
            --outputFile=test-results/security-junit.xml \
            security.rbac \
            security.schema
        env:
          CI: true

      - name: Upload security test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-unit-test-results
          path: test-results/
          retention-days: 30

      - name: Security test summary
        if: always()
        run: |
          echo "## Security Regression Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run-security-tests.outcome }}" = "success" ]; then
            echo "✅ All security regression tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security regression tests **FAILED**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Changes to \`amplify/data/resource.ts\` or role permission utilities" >> $GITHUB_STEP_SUMMARY
            echo "must not break the Authorization Matrix.  Download the" >> $GITHUB_STEP_SUMMARY
            echo "**security-unit-test-results** artifact for details." >> $GITHUB_STEP_SUMMARY
          fi

  security-e2e-tests:
    name: Security E2E Tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate required credentials on protected branches
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_VALID_PASSWORD: ${{ secrets.E2E_VALID_PASSWORD }}
        run: |
          missing=()
          [[ -z "$E2E_ADMIN_EMAIL" ]]    && missing+=("E2E_ADMIN_EMAIL")
          [[ -z "$E2E_MEMBER_EMAIL" ]]   && missing+=("E2E_MEMBER_EMAIL")
          [[ -z "$E2E_VALID_PASSWORD" ]] && missing+=("E2E_VALID_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "❌ ERROR: The following required secrets are not configured on this protected branch:"
            for secret in "${missing[@]}"; do
              echo "  - $secret"
            done
            echo ""
            echo "Security RBAC tests cannot run without role-specific credentials."
            echo "Configure these secrets in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✅ All required role credentials are configured."

      - name: Run security E2E tests
        id: run-security-e2e
        run: npx playwright test e2e/tests/security.spec.ts
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          E2E_DAD_EMAIL: ${{ secrets.E2E_DAD_EMAIL }}
          E2E_MOM_EMAIL: ${{ secrets.E2E_MOM_EMAIL }}
          E2E_CHILD1_EMAIL: ${{ secrets.E2E_CHILD1_EMAIL }}
          E2E_CHILD2_EMAIL: ${{ secrets.E2E_CHILD2_EMAIL }}
          E2E_VALID_PASSWORD: ${{ secrets.E2E_VALID_PASSWORD }}
          # Role-specific users for RBAC security tests.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}

      - name: Fail on skipped security tests
        if: always()
        run: |
          JUNIT_FILE="test-results/playwright-junit.xml"
          if [[ ! -f "$JUNIT_FILE" ]]; then
            if [[ "${{ steps.run-security-e2e.outcome }}" == "skipped" ]]; then
              echo "ℹ️ JUnit report not found – security E2E tests did not run (a prior step failed)."
              exit 0
            fi
            echo "❌ JUnit report not found at $JUNIT_FILE but E2E tests were expected to run."
            exit 1
          fi
          python3 -c '
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse("test-results/playwright-junit.xml")
          root = tree.getroot()
          skipped = [tc.get("name", "unknown") for tc in root.iter("testcase") if tc.find("skipped") is not None]
          if skipped:
              print(f"❌ ERROR: {len(skipped)} security test(s) were skipped - blocking merge.")
              print("")
              print("All security RBAC tests must execute and pass. Skipped tests indicate")
              print("missing credentials or unresolvable test preconditions.")
              print("")
              print("Skipped test names:")
              for name in skipped:
                  print(f"  - {name}")
              sys.exit(1)
          print("✅ No security tests were skipped.")
          '

      - name: Upload security E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-e2e-report
          path: playwright-report/
          retention-days: 30

      - name: Upload security E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-e2e-test-results
          path: test-results/
          retention-days: 30

      - name: Security E2E summary
        if: always()
        run: |
          echo "## Security E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run-security-e2e.outcome }}" = "success" ]; then
            echo "✅ All security E2E tests passed and none were skipped." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security E2E tests **FAILED** or tests were skipped." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All security RBAC tests must run and pass. Skipped tests are treated" >> $GITHUB_STEP_SUMMARY
            echo "as failures. Ensure all required secrets are configured:" >> $GITHUB_STEP_SUMMARY
            echo "E2E_ADMIN_EMAIL, E2E_PLANNER_EMAIL, E2E_MEMBER_EMAIL, E2E_VALID_PASSWORD." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the **security-e2e-report** artifact for the HTML report." >> $GITHUB_STEP_SUMMARY
          fi
