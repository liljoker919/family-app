name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --settings=family_project.settings.ci --verbosity=2

  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            set -e

            sudo chown -R ec2-user:ec2-user /srv/family-app

            cd /srv/family-app

            find /srv/family-app -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

            git fetch origin main
            git reset --hard origin/main

            set -a
            source <(sudo cat /etc/family-app/env)
            set +a

            export DJANGO_SETTINGS_MODULE=family_project.settings.prod

            /srv/family-app/venv/bin/pip install -r requirements.txt --quiet

            /srv/family-app/venv/bin/python manage.py migrate --noinput
            /srv/family-app/venv/bin/python manage.py collectstatic --noinput

            sudo systemctl restart family-app
            sudo systemctl reload nginx

            echo "Deployment complete."
