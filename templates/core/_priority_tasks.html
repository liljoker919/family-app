<div id="priority-tasks">
  {% if priority_tasks %}
  <ul class="divide-y divide-gray-100">
    {% for task in priority_tasks %}
    <li class="flex items-center gap-3 py-2.5 first:pt-0 last:pb-0">
      <form method="post" action="{% url 'tasks:change_status' task.pk %}"
            hx-post="{% url 'tasks:change_status' task.pk %}"
            hx-target="#priority-tasks"
            hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="status" value="COMPLETED">
        <input type="hidden" name="partial" value="dashboard">
        <input type="hidden" name="next" value="{% url 'core:dashboard' %}">
        <button type="submit" aria-label="Mark done"
                class="h-5 w-5 shrink-0 rounded border-2 border-gray-300 hover:border-green-500 hover:bg-green-50 transition-colors"></button>
      </form>
      <span class="inline-flex shrink-0 rounded-full px-2 py-0.5 text-xs font-semibold
        {% if task.priority == 'urgent' %}bg-red-100 text-red-700
        {% elif task.priority == 'high' %}bg-orange-100 text-orange-700
        {% elif task.priority == 'medium' %}bg-brand-terracotta/15 text-brand-terracotta-hover
        {% else %}bg-gray-100 text-gray-500{% endif %}">
        {{ task.get_priority_display }}
      </span>
      <a href="{% url 'tasks:task_detail' task.pk %}" class="min-w-0 flex-1 truncate text-sm text-gray-800 hover:text-brand-terracotta">
        {{ task.title }}
      </a>
      {% if task.due_date %}
      <span class="shrink-0 text-xs {% if task.due_date < today %}font-medium text-red-600{% else %}text-gray-400{% endif %}">
        {{ task.due_date }}
      </span>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
  <a href="{% url 'tasks:board' %}" class="mt-3 inline-block text-xs font-semibold text-brand-terracotta hover:underline">
    View all tasks →
  </a>
  {% else %}
  <p class="text-sm text-gray-400">
    Nothing on your plate right now. <a href="{% url 'tasks:task_create' %}" class="text-brand-terracotta hover:underline">Add a task</a>
  </p>
  {% endif %}
</div>
