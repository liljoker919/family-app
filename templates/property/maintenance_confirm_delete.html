{% extends "base.html" %}
{% block title %}Delete Project — Hey Famly{% endblock %}
{% block page_title %}Delete Project{% endblock %}

{% block content %}
<div class="max-w-md">
  <div class="rounded-xl border border-red-100 bg-white p-6 shadow-sm">
    <p class="text-sm text-gray-700">
      Are you sure you want to delete <strong>{{ object.title }}</strong>?
      This cannot be undone.
    </p>
    <form method="post" class="mt-5 flex gap-3">
      {% csrf_token %}
      <button type="submit"
              class="rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-700 transition-colors">
        Yes, delete
      </button>
      <a href="{% url 'property:property_detail' object.prop.pk %}"
         class="rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
        Cancel
      </a>
    </form>
  </div>
</div>
{% endblock %}
