{% extends "base.html" %}

{% block title %}Password Changed — Hey Famly{% endblock %}
{% block page_title %}Password Changed{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-16">
  <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-emerald-50">
    <svg class="h-7 w-7 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
    </svg>
  </div>
  <h2 class="mt-6 text-xl font-bold text-gray-900">Your password was changed</h2>
  <div class="mt-8">
    <a href="{% url 'core:profile' %}"
       class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">
      Back to profile
    </a>
  </div>
</div>
{% endblock %}
