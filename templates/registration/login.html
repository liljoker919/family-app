{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Hey Famly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { navy: '#1A324E', sage: '#698069', terracotta: '#DA6C4A', 'terracotta-hover': '#B85A3E' }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-slate-900 flex items-center justify-center p-4">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <div class="flex items-center gap-3">
        <img src="{% static 'img/sidebar_logo.png' %}" alt="" class="h-10 w-10">
        <span class="text-white font-semibold text-xl tracking-tight">Hey Famly</span>
      </div>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h1 class="text-xl font-semibold text-gray-900 mb-6 text-center">Sign in to your account</h1>

      {% if form.errors %}
      <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
        Invalid username or password. Please try again.
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="space-y-4">
          <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input id="id_username"
                   name="username"
                   type="text"
                   autocomplete="username"
                   required
                   autofocus
                   class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-brand-terracotta focus:outline-none focus:ring-1 focus:ring-brand-terracotta">
          </div>

          <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="id_password"
                   name="password"
                   type="password"
                   autocomplete="current-password"
                   required
                   class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-brand-terracotta focus:outline-none focus:ring-1 focus:ring-brand-terracotta">
          </div>
        </div>

        <button type="submit"
                class="mt-6 w-full rounded-lg bg-brand-terracotta px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-terracotta-hover focus:outline-none focus:ring-2 focus:ring-brand-terracotta focus:ring-offset-2 transition-colors">
          Sign in
        </button>
      </form>
    </div>

  </div>

</body>
</html>
