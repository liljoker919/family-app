<li class="flex items-center gap-3 px-4 py-3">
  <div class="flex-1 min-w-0">
    <span class="text-sm text-gray-800">{{ item }}</span>
    {% if item.source_recipe %}
    <span class="ml-2 text-xs text-gray-400">from {{ item.source_recipe.title }}</span>
    {% endif %}
  </div>
  <div class="flex shrink-0 gap-3 text-xs">
    <a href="{% url 'shopping:item_update' item.pk %}"
       class="font-medium text-brand-terracotta hover:text-brand-terracotta-hover">Edit</a>
    <a href="{% url 'shopping:item_delete' item.pk %}"
       class="font-medium text-red-400 hover:text-red-600">Del</a>
  </div>
</li>
