[pytest]
DJANGO_SETTINGS_MODULE = family_project.settings.e2e
# *_test.py (not pytest's default test_*.py) so Django's own manage.py
# test — which discovers test*.py across the whole repo, not just
# installed apps — never tries to import these and choke on pytest-only
# imports that requirements.txt (unlike requirements-dev.txt) doesn't
# install.
python_files = *_test.py
addopts = -ra
